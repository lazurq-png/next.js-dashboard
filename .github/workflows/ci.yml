name: CI

# Every branch, including the night-** branches an unattended run pushes and polls.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Lint, type check, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # jsdom 30 requires ^22.22.2 || ^24.15.0 || >=26.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Type check
        run: npx next typegen && npx tsc --noEmit
      # The unit tests run in three named groups, each even if an earlier one failed,
      # so a failure is identifiable from the job's step names alone.
      - name: Unit tests (dashboard)
        if: ${{ !cancelled() }}
        run: npx vitest run tests/unit/actions tests/unit/schemas tests/unit/utils
      - name: Unit tests (cats, Node)
        if: ${{ !cancelled() }}
        run: >-
          npx vitest run tests/unit/xenocats/random tests/unit/xenocats/effects
          tests/unit/xenocats/cursor-controller tests/unit/xenocats/cat-engine
          tests/unit/xenocats/cat-types
      - name: Unit tests (cats, jsdom)
        if: ${{ !cancelled() }}
        run: >-
          npx vitest run tests/unit/xenocats/cursor-kind tests/unit/xenocats/fake-cursor
          tests/unit/xenocats/cat-layer

  build:
    name: Build + browser tests (production)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUTH_TRUST_HOST: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Throwaway AUTH_SECRET
        # Only signs sessions inside this run, so it need not be a repository secret.
        run: |
          secret="$(openssl rand -base64 32)"
          echo "::add-mask::$secret"
          echo "AUTH_SECRET=$secret" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run build
        env:
          # Only this step: prerendering /dashboard reads the database (read-only,
          # nothing here writes). Kept out of `npm ci`, whose install scripts
          # have no business seeing it.
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      - run: npx playwright install --with-deps chromium
      - name: Browser tests against next start
        run: npm run test:e2e
        env:
          E2E_SERVER: start
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-production
          path: playwright-report/
          retention-days: 7

  e2e:
    name: Browser tests (dev server)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUTH_TRUST_HOST: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Throwaway AUTH_SECRET
        run: |
          secret="$(openssl rand -base64 32)"
          echo "::add-mask::$secret"
          echo "AUTH_SECRET=$secret" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
